<app-room-form (roomCreated)="addRoom($event)" />


<h2>Rooms</h2>

@if (rooms().length === 0) {
    <p>No rooms yet.</p>
}


<ul>
    @for (room of rooms(); track room.id) {
        <li>
            <a [routerLink]="['/rooms', room.id]">{{ room.name }}</a> | seats {{ room.capacity }}
        </li>
    }
</ul>
