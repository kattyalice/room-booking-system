name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: booking
                    POSTGRES_PASSWORD: booking
                    POSTGRES_DB: booking
                ports:
                    - 5433:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5s

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: '21'
                cache: maven

            - name: Run tests
              working-directory: backend
              run: chmod +x mvnw && ./mvnw -B test